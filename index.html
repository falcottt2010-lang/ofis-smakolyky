<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Смаколики в офісі</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf7ff;
      color: #21172d;
      padding-bottom: 120px;
    }

    .wrap {
      max-width: 950px;
      margin: 0 auto;
      padding: 16px;
    }

    .hero {
      background: #ffffff;
      border: 1px solid #e6d4f7;
      border-radius: 22px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(70, 20, 120, 0.08);
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      color: #7b2cbf;
      font-size: 30px;
    }

    .sub {
      margin-top: 8px;
      color: #6b6175;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .card {
      background: white;
      border: 1px solid #e6d4f7;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 8px 20px rgba(70, 20, 120, 0.06);
      min-height: 245px;
      display: flex;
      flex-direction: column;
    }

    .img {
      height: 110px;
      background: #fbf9ff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      overflow: hidden;
      font-size: 38px;
    }

    .img img {
      max-width: 100%;
      max-height: 110px;
      object-fit: contain;
    }

    .name {
      font-weight: 800;
      min-height: 38px;
      font-size: 15px;
    }

    .cat {
      color: #6b6175;
      font-size: 13px;
      margin-top: 4px;
    }

    .price {
      color: #7b2cbf;
      font-size: 24px;
      font-weight: 900;
      margin-top: 8px;
    }

    .stock {
      color: #6b6175;
      font-size: 13px;
      margin-top: 4px;
    }

    .buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      padding-top: 12px;
    }

    button {
      border: 0;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .qtyBtn {
      width: 42px;
      height: 42px;
      background: #f3e8ff;
      color: #4b1d73;
    }

    .qty {
      min-width: 26px;
      text-align: center;
      font-weight: 900;
      font-size: 18px;
    }

    .add {
      flex: 1;
      height: 42px;
      background: #7b2cbf;
      color: #ffffff;
    }

    .cart {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      border-top: 1px solid #e6d4f7;
      box-shadow: 0 -8px 24px rgba(70, 20, 120, .12);
      padding: 12px 16px;
      z-index: 10;
    }

    .cartInner {
      max-width: 950px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .cartInfo {
      flex: 1;
    }

    .total {
      color: #7b2cbf;
      font-size: 24px;
      font-weight: 900;
    }

    .pay {
      background: #19a463;
      color: #ffffff;
      padding: 14px 18px;
      white-space: nowrap;
    }

    .loader {
      padding: 18px;
      text-align: center;
      color: #6b6175;
    }

    .error {
      display: none;
      background: #fff1f0;
      color: #d93025;
      border: 1px solid #ffd1cc;
      border-radius: 14px;
      margin-bottom: 12px;
      padding: 12px;
    }

    .modalBack {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 10, 30, 0.55);
      z-index: 50;
      padding: 16px;
      align-items: center;
      justify-content: center;
    }

    .modal {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
    }

    .modal h2 {
      margin: 0 0 12px;
      color: #7b2cbf;
    }

    .orderList {
      white-space: pre-line;
      background: #faf7ff;
      border: 1px solid #e6d4f7;
      border-radius: 14px;
      padding: 12px;
      margin: 12px 0;
      font-size: 14px;
    }

    .cardNumber {
      background: #f3e8ff;
      color: #4b1d73;
      border-radius: 14px;
      padding: 12px;
      font-weight: 900;
      text-align: center;
      font-size: 20px;
      margin: 10px 0;
    }

    .modalActions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .monoBtn {
      background: #7b2cbf;
      color: white;
      padding: 14px;
      text-align: center;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 900;
      display: block;
    }

    .paidBtn {
      background: #19a463;
      color: white;
      padding: 14px;
      width: 100%;
    }

    .backBtn {
      background: #eee7f6;
      color: #4b1d73;
      padding: 14px;
      width: 100%;
    }

    .smallNote {
      color: #6b6175;
      font-size: 13px;
      line-height: 1.4;
    }

    @media (max-width: 520px) {
      .grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      h1 {
        font-size: 24px;
      }

      .card {
        padding: 10px;
        min-height: 225px;
      }

      .cartInner {
        flex-direction: column;
        align-items: stretch;
      }

      .pay {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hero">
      <h1 id="title">Смаколики в офісі</h1>
      <div class="sub">Обери товар → оплати → натисни “Я оплатив”</div>
    </div>

    <div id="error" class="error"></div>
    <div id="loader" class="loader">Завантажую товари...</div>
    <div id="grid" class="grid"></div>
  </div>

  <div class="cart">
    <div class="cartInner">
      <div class="cartInfo">
        <div>Кошик: <b id="count">0</b> шт.</div>
        <div class="total"><span id="total">0</span> грн</div>
      </div>

      <button class="pay" onclick="openOrderModal()">Оформити</button>
    </div>
  </div>

  <div id="modalBack" class="modalBack">
    <div class="modal">
      <h2>Оплата</h2>

      <div id="modalOrder" class="orderList"></div>

      <div class="smallNote" id="paymentText">
        Оплати через monobank, потім натисни “Я оплатив”.
      </div>

      <div class="cardNumber" id="cardNumber">4874 1000 2666 8288</div>

      <div class="modalActions">
        <a id="monoLink" class="monoBtn" href="#" target="_blank" rel="noopener">
          Оплатити в monobank
        </a>

        <button class="paidBtn" onclick="confirmPaid()">
          Я оплатив
        </button>

        <button class="backBtn" onclick="closeOrderModal()">
          Назад
        </button>
      </div>

      <p class="smallNote">
        Важливо: натискай “Я оплатив” тільки після фактичної оплати.
      </p>
    </div>
  </div>

  <script>
    let products = [];
    let settings = {};
    let cart = {};

    async function apiGetProducts() {
      const response = await fetch('/.netlify/functions/api?action=products');
      const data = await response.json();

      if (!data.ok) {
        throw new Error(data.error || 'Помилка завантаження товарів');
      }

      return data;
    }

    async function apiConfirmManualPayment(items) {
      const response = await fetch('/.netlify/functions/api', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          action: 'confirmManualPayment',
          items
        })
      });

      const data = await response.json();

      if (!data.ok) {
        throw new Error(data.error || 'Помилка запису замовлення');
      }

      return data;
    }

    async function loadShop() {
      try {
        hideError();

        const data = await apiGetProducts();

        products = data.products || [];
        settings = data.settings || {};

        document.getElementById('title').textContent =
          settings.title || 'Смаколики в офісі';

        document.getElementById('paymentText').textContent =
          settings.payment_text || 'Оплати через monobank, потім натисни “Я оплатив”.';

        document.getElementById('cardNumber').textContent =
          settings.card || '4874 1000 2666 8288';

        document.getElementById('monoLink').href =
          settings.mono_link || 'https://send.monobank.ua/jar/2tfoNe4ECT';

        document.getElementById('loader').style.display = 'none';

        render();
      } catch (error) {
        showError(error.message || String(error));
      }
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      if (!products.length) {
        grid.innerHTML = '<div class="loader">Активних товарів поки немає.</div>';
        renderCart();
        return;
      }

      products.forEach(function(p) {
        const q = cart[p.id] || 0;
        const img = p.image
          ? '<img src="' + escapeHtml(p.image) + '" alt="' + escapeHtml(p.name) + '">'
          : '🥤';

        const disabled = p.stock <= 0;

        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML =
          '<div class="img">' + img + '</div>' +
          '<div class="name">' + escapeHtml(p.name) + '</div>' +
          '<div class="cat">' + escapeHtml(p.category) + '</div>' +
          '<div class="price">' + p.price + ' грн</div>' +
          '<div class="stock">Залишок: ' + p.stock + '</div>' +
          '<div class="buttons">' +
            '<button class="qtyBtn" onclick="changeQty(\\'' + p.id + '\\', -1)" ' + (q <= 0 ? 'disabled' : '') + '>−</button>' +
            '<div class="qty">' + q + '</div>' +
            '<button class="qtyBtn" onclick="changeQty(\\'' + p.id + '\\', 1)" ' + (disabled || q >= p.stock ? 'disabled' : '') + '>+</button>' +
            '<button class="add" onclick="changeQty(\\'' + p.id + '\\', 1)" ' + (disabled || q >= p.stock ? 'disabled' : '') + '>' + (disabled ? 'Немає' : 'Додати') + '</button>' +
          '</div>';

        grid.appendChild(card);
      });

      renderCart();
    }

    function changeQty(id, delta) {
      const p = products.find(function(x) {
        return x.id === id;
      });

      if (!p) return;

      const current = cart[id] || 0;
      const next = Math.max(0, Math.min(p.stock, current + delta));

      if (next === 0) {
        delete cart[id];
      } else {
        cart[id] = next;
      }

      render();
    }

    function getCartLines() {
      return Object.keys(cart)
        .map(function(id) {
          const p = products.find(function(x) {
            return x.id === id;
          });

          if (!p) return null;

          return {
            id: id,
            qty: cart[id],
            price: p.price,
            name: p.name,
            sum: cart[id] * p.price
          };
        })
        .filter(Boolean);
    }

    function renderCart() {
      const lines = getCartLines();

      const count = lines.reduce(function(a, x) {
        return a + x.qty;
      }, 0);

      const total = lines.reduce(function(a, x) {
        return a + x.sum;
      }, 0);

      document.getElementById('count').textContent = count;
      document.getElementById('total').textContent = total;
    }

    function openOrderModal() {
      hideError();

      const lines = getCartLines();

      if (!lines.length) {
        showError('Спочатку додай товар у кошик.');
        return;
      }

      const text = lines.map(function(x) {
        return x.name + ' x' + x.qty + ' = ' + x.sum + ' грн';
      }).join('\n');

      const total = lines.reduce(function(a, x) {
        return a + x.sum;
      }, 0);

      document.getElementById('modalOrder').textContent =
        text + '\n\nДо сплати: ' + total + ' грн';

      document.getElementById('modalBack').style.display = 'flex';
    }

    function closeOrderModal() {
      document.getElementById('modalBack').style.display = 'none';
    }

    async function confirmPaid() {
      hideError();

      const lines = getCartLines();

      if (!lines.length) {
        closeOrderModal();
        showError('Кошик порожній.');
        return;
      }

      const total = lines.reduce(function(a, x) {
        return a + x.sum;
      }, 0);

      const ok = confirm(
        'Підтверджуєш, що оплатив ' + total + ' грн?\n\n' +
        'Після підтвердження замовлення буде записано як оплачене, а залишки спишуться.'
      );

      if (!ok) return;

      try {
        const result = await apiConfirmManualPayment(
          lines.map(function(x) {
            return {
              id: x.id,
              qty: x.qty
            };
          })
        );

        alert(
          'Дякую!\n\n' +
          'Замовлення: ' + result.orderNumber + '\n' +
          'Сума: ' + result.total + ' грн\n' +
          'Статус: Оплачено вручну'
        );

        cart = {};
        closeOrderModal();
        await loadShop();
      } catch (error) {
        closeOrderModal();
        showError(error.message || String(error));
      }
    }

    function showError(text) {
      const el = document.getElementById('error');
      el.textContent = text;
      el.style.display = 'block';
      document.getElementById('loader').style.display = 'none';
    }

    function hideError() {
      const el = document.getElementById('error');
      el.textContent = '';
      el.style.display = 'none';
    }

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    loadShop();
  </script>
</body>
</html>
